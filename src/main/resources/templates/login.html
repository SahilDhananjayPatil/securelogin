<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Instagram Clone</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #2d3748; /* bg-gray-800 */
        }
        ::-webkit-scrollbar-thumb {
            background: #4a5568; /* bg-gray-600 */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280; /* bg-gray-500 */
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased flex items-center justify-center min-h-screen p-4">
    <main class="w-full max-w-md">
        <section class="bg-gray-800 shadow-lg rounded-lg p-8 space-y-6 border border-gray-700">
            <h1 class="text-3xl font-bold text-center text-white">Login</h1>
            <p class="text-center text-gray-400">Sign in to your Instagram Clone account</p>

            <div id="error-message" class="hidden bg-red-600 text-white p-3 rounded-md text-sm font-medium" role="alert">
                <!-- Error messages will be displayed here -->
            </div>

            <form id="login-form" class="space-y-5">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-300 mb-1">Email Address</label>
                    <input type="email" id="email" name="email" required
                           class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-white placeholder-gray-400"
                           placeholder="you@example.com">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                    <input type="password" id="password" name="password" required
                           class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-white placeholder-gray-400"
                           placeholder="••••••••">
                </div>
                <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-800">
                    Login
                </button>
            </form>

            <p class="text-center text-gray-400 text-sm">
                Don't have an account? <a href="/register" class="text-blue-500 hover:underline">Register here</a>
            </p>
        </section>
    </main>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function(event) {
            event.preventDefault(); // Prevent default form submission

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessageDiv = document.getElementById('error-message');

            errorMessageDiv.classList.add('hidden'); // Hide previous errors

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json', // Assuming JSON payload
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json(); // Assuming JSON response from backend

                if (response.ok) { // HTTP status 200-299
                    // Handle success, e.g., redirect to home page
                    window.location.href = '/home';
                } else {
                    // Handle errors
                    errorMessageDiv.textContent = data.message || 'Login failed. Invalid credentials.';
                    errorMessageDiv.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Network error:', error);
                errorMessageDiv.textContent = 'A network error occurred. Please try again later.';
                errorMessageDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
