<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Edit Profile</title>
	<style>
		body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6fb; }
		.wrap { max-width: 700px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
		h1 { color: #333; margin-bottom: 10px; }
		.subtitle { color: #666; margin-bottom: 20px; }
		.form-row { margin-bottom: 15px; }
		label { display:block; font-weight:600; margin-bottom:6px; color:#444; }
		input[type="text"], textarea, select { width:100%; padding:10px 12px; border:1px solid #e1e5ee; border-radius:6px; }
		textarea { min-height:100px; resize:vertical; }
		.actions { display:flex; gap:10px; margin-top:20px; }
		.btn { padding:10px 18px; border-radius:6px; border:none; cursor:pointer; font-weight:600; }
		.btn-primary { background: linear-gradient(90deg,#667eea,#764ba2); color:#fff; }
		.btn-secondary { background:#eef2ff; color:#333; }
		.message { padding:12px; border-radius:6px; margin-bottom:12px; }
		.success { background:#eefbe9; color:#1a7f2e; border-left:4px solid #1a7f2e; }
		.error { background:#fff0f0; color:#9b1a1a; border-left:4px solid #d9534f; }
		.meta { margin-top:8px; color:#777; font-size:13px; }
		.top-links { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
	</style>
</head>
<body>
	<div class="wrap">
		<div class="top-links">
			<div>
				<a th:href="@{/home}">← Back to Dashboard</a>
			</div>
			<div>
				<a th:href="@{/logout}">Logout</a>
			</div>
		</div>

		<h1>Edit Profile</h1>
		<div class="subtitle">Update your public profile information below.</div>

		<!-- Flash messages -->
		<div th:if="${success}" class="message success" th:text="${success}"></div>
		<div th:if="${error}" class="message error" th:text="${error}"></div>

		<form th:action="@{/profile}" method="post">
			<div class="form-row">
				<label>Display Name</label>
				<input type="text" th:value="${user.firstName}" readonly />
				<div class="meta">Username: <span th:text="${user.username}"></span> • Email: <span th:text="${user.email}"></span></div>
			</div>

			<div class="form-row">
				<label for="bio">Bio</label>
				<textarea id="bio" name="bio" th:text="${user.bio}"></textarea>
			</div>

			<div class="form-row">
				<label for="website">Website</label>
				<input id="website" name="website" type="text" th:value="${user.website}" />
			</div>

			<div class="form-row">
				<label for="gender">Gender</label>
				<select id="gender" name="gender">
					<option th:selected="${user.gender} == null" value="">Prefer not to say</option>
					<option th:selected="${user.gender} == 'MALE'" value="MALE">Male</option>
					<option th:selected="${user.gender} == 'FEMALE'" value="FEMALE">Female</option>
					<option th:selected="${user.gender} == 'OTHER'" value="OTHER">Other</option>
				</select>
			</div>

			<div class="actions">
				<button type="submit" class="btn btn-primary">Save Changes</button>
				<a th:href="@{/home}" class="btn btn-secondary">Cancel</a>
			</div>
		</form>
	</div>
</body>
</html>
