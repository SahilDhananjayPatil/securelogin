spring.application.name=instagram-clone

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/instagram_clone_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# File Upload Configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads/

# AWS S3 Configuration (Set these environment variables in production)
app.aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:instagram-clone-uploads}
app.aws.s3.region=${AWS_S3_REGION:us-east-1}
app.aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
app.aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:your-secret-key-change-in-production-very-long-random-string}
app.jwt.expiration=86400000

# Session Configuration
server.servlet.session.timeout=30m
spring.session.store-type=jdbc

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Actuator Configuration for Monitoring
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoint.health.show-details=always
management.metrics.tags.application=instagram-clone
management.endpoint.prometheus.access=unrestricted

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.copilot_project=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Jackson Configuration for JSON
spring.jackson.default-property-inclusion=non_null
#spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
#spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
